name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# CI 僅讀取程式碼、驗證編譯與測試；不提交、不推送、不建立 Tag 或 Release。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 / 最新穩定 Rust
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"

    steps:
      - name: 取得原始碼
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 自動同步 Rust 結構化版本欄位的隔離回歸測試
        shell: pwsh
        run: ./tools/Test-Rust-Version-Automation.ps1

      - name: 驗證 Rust 工具鏈與 MSRV 版本一致
        shell: pwsh
        run: ./tools/Assert-Rust-Version-Consistency.ps1

      - name: 安裝最新穩定 Rust、rustfmt 與 Clippy
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw '安裝 Rust stable 失敗' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw '設定 Rust stable 失敗' }
          rustc +stable --version
          cargo +stable --version

      - name: 快取 Cargo 套件下載
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: 檢查 Rust 格式
        run: cargo +stable fmt --all -- --check

      - name: Clippy 靜態分析
        run: cargo +stable clippy --all-targets --locked

      - name: 執行 Rust 單元測試
        run: cargo +stable test --locked

      - name: 編譯 Windows x64 Release EXE
        run: cargo +stable build --release --locked

      - name: 確認 EXE 名稱、版本及可執行性
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'target/x86_64-pc-windows-msvc/release/Codex-Conversation-Handoff-Exporter.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "找不到 Windows x64 執行檔：$exe"
          }
          $metadata = cargo +stable metadata --format-version 1 --no-deps --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw '無法讀取 Cargo 專案版本' }
          $packages = @($metadata.packages | Where-Object { $_.name -eq 'codex-conversation-handoff-exporter' })
          if ($packages.Count -ne 1) { throw 'Cargo 專案身分不唯一或不存在' }
          $expectedVersion = $packages[0].version
          $output = @(& $exe --version)
          if ($LASTEXITCODE -ne 0 -or -not (($output -join ' ') -split '\s+' -contains $expectedVersion)) {
            throw "EXE 版本不符合 Cargo.toml：$($output -join ' ')"
          }
          Write-Host "Windows x64 EXE：$exe"
          Write-Host "版本：$($output -join ' ')"
          Get-FileHash -LiteralPath $exe -Algorithm SHA256

      # These three scripts are identical to those in the qualified Windows R1
      # test package; no private Codex data is used on GitHub-hosted runners.
      - name: Windows EXE 11 組合成回歸情境
        shell: pwsh
        run: |
          $exe = [IO.Path]::GetFullPath('target/x86_64-pc-windows-msvc/release/Codex-Conversation-Handoff-Exporter.exe')
          $dir = Join-Path $env:RUNNER_TEMP 'codex-qualification'
          $logs = Join-Path $dir 'logs'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/Invoke-Synthetic-Regression.ps1 -Executable $exe -WorkDirectory (Join-Path $dir 'synthetic') -LogDirectory $logs
          if ($LASTEXITCODE -ne 0) { throw '11 synthetic EXE scenarios failed; check attached diagnostics' }

      - name: Windows EXE 子代理回歸
        shell: pwsh
        run: |
          $exe = [IO.Path]::GetFullPath('target/x86_64-pc-windows-msvc/release/Codex-Conversation-Handoff-Exporter.exe')
          $dir = Join-Path $env:RUNNER_TEMP 'codex-qualification'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/Invoke-R9-Subagent-Regression.ps1 -Executable $exe -WorkDirectory (Join-Path $dir 'subagents') -LogDirectory (Join-Path $dir 'logs')
          if ($LASTEXITCODE -ne 0) { throw 'Subagent EXE regression failed; check attached diagnostics' }

      - name: Windows EXE Schema 及附件精確性回歸
        shell: pwsh
        run: |
          $exe = [IO.Path]::GetFullPath('target/x86_64-pc-windows-msvc/release/Codex-Conversation-Handoff-Exporter.exe')
          $dir = Join-Path $env:RUNNER_TEMP 'codex-qualification'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/Invoke-Schema-Regression.ps1 -Executable $exe -WorkDirectory (Join-Path $dir 'schema') -LogDirectory (Join-Path $dir 'logs')
          if ($LASTEXITCODE -ne 0) { throw 'Schema/attachment EXE regression failed; check attached diagnostics' }

      - name: 保留 Windows EXE 回歸診斷
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: windows-exe-e2e-diagnostics
          path: ${{ runner.temp }}/codex-qualification/logs/
          if-no-files-found: ignore
          retention-days: 14

  minimum-rust:
    name: Windows x64 / pinned Rust MSRV
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"

    steps:
      - name: 取得原始碼
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 驗證並安裝固定 Rust MSRV
        shell: pwsh
        run: |
          $pin = & ./tools/Assert-Rust-Version-Consistency.ps1 -EmitVersion
          if (-not $pin -or $pin -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid pinned Rust version' }
          rustup toolchain install $pin --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Could not install Rust $pin" }
          & rustc "+$pin" --version
          if ($LASTEXITCODE -ne 0) { throw "Cannot run Rust $pin" }
          & cargo "+$pin" --version
          if ($LASTEXITCODE -ne 0) { throw "Cannot run Cargo $pin" }
          "PINNED_RUST=$pin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 快取 Cargo 套件下載
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: 固定 Rust MSRV 編譯確認
        shell: pwsh
        run: |
          & cargo "+$env:PINNED_RUST" check --locked
          if ($LASTEXITCODE -ne 0) { throw "Rust $env:PINNED_RUST compatibility check failed" }
