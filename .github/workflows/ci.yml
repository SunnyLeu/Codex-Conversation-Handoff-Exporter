name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# CI 僅讀取程式碼、驗證編譯與測試；不提交、不推送、不建立 Tag 或 Release。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 / 最新穩定 Rust
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"

    steps:
      - name: 取得原始碼
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 安裝最新穩定 Rust 與 rustfmt
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw '安裝 Rust stable 失敗' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw '設定 Rust stable 失敗' }
          rustc --version
          cargo --version

      - name: 快取 Cargo 套件下載
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: 檢查 Rust 格式
        run: cargo fmt --all -- --check

      - name: 執行 Rust 單元測試
        run: cargo test --locked

      - name: 編譯 Windows x64 Release EXE
        run: cargo build --release --locked

      - name: 確認 EXE 名稱、版本及可執行性
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'target/x86_64-pc-windows-msvc/release/Codex-Conversation-Handoff-Exporter.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "找不到 Windows x64 執行檔：$exe"
          }
          $metadata = cargo metadata --format-version 1 --no-deps --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw '無法讀取 Cargo 專案版本' }
          $packages = @($metadata.packages | Where-Object { $_.name -eq 'codex-conversation-handoff-exporter' })
          if ($packages.Count -ne 1) { throw 'Cargo 專案身分不唯一或不存在' }
          $expectedVersion = $packages[0].version
          $output = @(& $exe --version)
          if ($LASTEXITCODE -ne 0 -or -not (($output -join ' ') -split '\s+' -contains $expectedVersion)) {
            throw "EXE 版本不符合 Cargo.toml：$($output -join ' ')"
          }
          Write-Host "Windows x64 EXE：$exe"
          Write-Host "版本：$($output -join ' ')"
          Get-FileHash -LiteralPath $exe -Algorithm SHA256

  minimum-rust:
    name: Windows x64 / 最低支援 Rust 1.98.0
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"

    steps:
      - name: 取得原始碼
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 安裝最低支援 Rust 1.98.0
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw '安裝 Rust 1.98.0 失敗' }
          rustup default 1.98.0
          if ($LASTEXITCODE -ne 0) { throw '設定 Rust 1.98.0 失敗' }
          rustc --version
          cargo --version

      - name: 快取 Cargo 套件下載
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: 驗證 Rust 1.98.0 可編譯
        run: cargo check --locked
