name: GitHub Actions Upgrade Smoke Test

# Manual-only verification for the versions proposed by Dependabot PR #9/#10.
# It does not run the exporter or publish a release.
on:
  workflow_dispatch:
    inputs:
      create_test_draft_pr:
        description: 'Also create a temporary DRAFT test PR (close it after verifying)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  upload:
    name: Upload real sample with upload-artifact v7.0.2
    runs-on: windows-latest
    steps:
      - name: Generate fixed UTF-8 and binary test files
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'action-smoke-payload'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $dir 'bytes.bin'), [byte[]]@(0, 1, 2, 3, 10, 13, 127, 128, 255))
          [IO.File]::WriteAllText((Join-Path $dir 'unicode.txt'), '臺灣 Windows x64 / artifact roundtrip', [Text.UTF8Encoding]::new($false))
      - name: Upload using PR #9 candidate version
        uses: actions/upload-artifact@v7.0.2
        with:
          name: upgrade-smoke-payload
          path: ${{ runner.temp }}/action-smoke-payload/
          if-no-files-found: error
          retention-days: 1

  download-and-verify:
    name: Download with v8.0.2 and verify exact bytes
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - name: Download using PR #10 candidate version
        uses: actions/download-artifact@v8.0.2
        with:
          name: upgrade-smoke-payload
          path: downloaded
      - name: Verify both files byte-for-byte
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          folder = Path('downloaded')
          expected = {
              'bytes.bin': bytes((0, 1, 2, 3, 10, 13, 127, 128, 255)),
              'unicode.txt': '臺灣 Windows x64 / artifact roundtrip'.encode('utf-8'),
          }
          actual = {p.name: p.read_bytes() for p in folder.iterdir() if p.is_file()}
          assert actual == expected, f'Artifact mismatch: {sorted(actual)}'
          print('PASS: upload-artifact@v7.0.2 -> download-artifact@v8.0.2')
          print('PASS: exact UTF-8 and binary payload preserved')
          PYTHON

  draft-pr:
    name: Create isolated test-only Draft PR with v8.1.3
    needs: download-and-verify
    if: ${{ inputs.create_test_draft_pr == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted main (do not persist credentials)
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Prepare harmless test-only file
        shell: bash
        run: |
          mkdir -p .github/actions-compatibility-smoke
          printf 'temporary smoke-test run=%s\n' "$GITHUB_RUN_ID" > .github/actions-compatibility-smoke/probe.txt
      - name: Create test-only DRAFT PR using PR #9 candidate version
        id: cpr
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/actions-compatibility-smoke-${{ github.run_id }}
          add-paths: .github/actions-compatibility-smoke/probe.txt
          commit-message: 'test: 驗證 GitHub Actions 升級相容性'
          title: 'test: GitHub Actions 相容性驗證（測試用，請勿合併）'
          body: |
            **Temporary smoke-test Draft PR. Do NOT merge.**
            Only contains a harmless probe file. This is not a dependency update.
            After validation, close this PR and delete its test branch.
          draft: always-true
          delete-branch: false
      - name: Verify actual PR exists and remains Draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          test -n "$PR_NUMBER" || { echo 'No PR number returned'; exit 1; }
          case "$PR_OPERATION" in
            created|updated) ;;
            *) echo "Unexpected PR operation: $PR_OPERATION"; exit 1 ;;
          esac
          is_draft="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.draft and .state == "open"')"
          test "$is_draft" = true || { echo "PR is not an open Draft: $PR_URL"; exit 1; }
          echo "PASS: create-pull-request@v8.1.3 created/updated a Draft PR: $PR_URL"
          echo 'IMPORTANT: Close the test PR and delete its branch; do not merge it.'
