version: 2
updates:
  # Rust + Cargo MSRV are updated together by Latest Compatibility.
  # Do not create a separate rust-toolchain PR that would fail MSRV synchronization.
  # Cargo and GitHub Actions updates remain managed by Dependabot.
  # Cargo.lock includes direct, build, target-specific and transitive crates.
  # Major upgrades remain individual PRs so API/compatibility can be reviewed.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "11:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 20
    cooldown:
      default-days: 1
    allow:
      - dependency-type: "all"
    commit-message:
      prefix: "build"
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions referenced by .github/workflows/*.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 1
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
